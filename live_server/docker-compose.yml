services:
  redis:
    image: redis:${REDIS_VERSION:-latest}
    container_name: opentranslive-redis
    networks:
      - opentranslive-net
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1024mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}

  mongodb:
    image: mongo:${MONGODB_VERSION:-latest}
    container_name: opentranslive-db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./mongo_data:/data/db
    networks:
      - opentranslive-net

  backend:
    build:
      context: .
      args:
        SOURCE_REPOSITORY_URL: ${SOURCE_REPOSITORY_URL:-https://github.com/g0v/OpenTransLive}
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    container_name: opentranslive-app
    ports:
      - "127.0.0.1:${SERVER_PORT:-5000}:5000"
    environment:
      # Without this the container never sees ENVIRONMENT and silently runs in
      # development mode (insecure cookies, permissive CORS, dev-only logging).
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Production deployments must point users to this deployed version's
      # complete corresponding source (preferably an immutable tag or commit).
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
      PROFESSIONAL_SERVICES_URL: ${PROFESSIONAL_SERVICES_URL:-}
      SOURCE_REPOSITORY_URL: ${SOURCE_REPOSITORY_URL:-}
      SOURCE_REVISION: ${SOURCE_REVISION:-}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Socket.IO fan-out and transcription session state are process-local.
    # Keep one worker; supporting more requires moving that state to Redis.
    command: ["./.venv/bin/uvicorn", "app:socket_app", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--ws", "websockets"]
    depends_on:
      - redis
      - mongodb
    networks:
      - opentranslive-net

networks:
  opentranslive-net:
    name: opentranslive-net
