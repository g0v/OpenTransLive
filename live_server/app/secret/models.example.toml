# Prompt templates and per-provider model settings for the chat-completion
# translators. Edit this file to tune prompts or swap models without touching
# providers.py. Structural per-provider fields (endpoint, api key, system role)
# stay in the provider classes.
#
# Prompt placeholders are filled with str.format:
#   correct   -> {keywords} {prev_corrected}
#   translate -> {language} {tone} {keywords} {prev_translation}
#   extract_keywords -> (no placeholders; sent verbatim)
#   generate_glossary -> {term} {languages}
#
# generate_glossary is optional and Gemini-only (it needs Google Search
# grounding, which the OpenAI-compatible shim does not expose). Without it, and
# without a [providers.gemini.glossary] table, the panel's "generate glossary"
# button reports the feature as unconfigured instead of failing.

[prompts]
correct = """
Fix the ASR transcript literally: remove disfluencies, fillers, dirty words. No styling/summaries.

"Previous" is a shorter earlier version of this same line, given for wording consistency only \
- NOT text you already sent. Always rewrite the input in full; never output only what is new.
Output ONLY the corrected text.
Keywords: {keywords}
Previous: {prev_corrected}"""

translate = """
Role: Native {language} Expert Translator & Localizer.
Task: Translate <translate_this> into natural, native-level {language}.

Rules:
1. Ensure accuracy first; Tone: {tone}.
2. Adapt target conventions. Fix punctuation.
3. "Previous translation" renders a shorter earlier version of this same line: reuse its \
wording, but write it out again in full.
4. Always translate ALL of <translate_this>; never output only the new increment.
5. Use <context> for reference only. NEVER repeat or continue them.
6. Output ONLY the final translated text of <translate_this>. No explanations.

Keywords(ordered): {keywords}
Previous translation: {prev_translation}
"""

extract_keywords = """
If there are special nouns or names in the provided text, add them to the special_keywords list.
Exclude time, numbers, and common words.
Return in json format:
{"special_keywords": []}"""

generate_glossary = """
You build glossaries for live-broadcast subtitles. The term below is usually a \
person, company, product, or field-specific term that a generic translator gets \
wrong or renders inconsistently.

Term: {term}
Wanted languages: {languages}

Search the web first. Identify what the term actually refers to, then find the \
spelling each language's audience already uses for it.

Rules:
0. If the search finds nothing about this term — it is a typo, or nothing real by \
that name exists — return an empty object {{}}. Do not pad the answer by repeating \
the term back in every language.
1. Only give a spelling that is established in real use. If a language has no \
customary rendering, OMIT that language — never invent a transliteration.
2. A language whose audience normally keeps the term in its original form should \
map to the original form.
3. Also include the term EXACTLY as written above, keyed by its own BCP-47 code. \
Do not normalise its spelling: this is the form that has to be recognised in the transcript. \
If that code is already one of the wanted languages, use that same code and put the verbatim \
term there — never invent a variant code or a private-use subtag.
4. Every key must be a BCP-47 language code: one from the list above, or the term's \
own. Nothing else is a key — the term itself is never a key.

Output ONLY a JSON object mapping language code to spelling, no prose, no code fence:
{{"en-US": "...", "zh-Hant-TW": "..."}}"""

# Human-readable tone descriptions substituted into {tone}. Unknown tones are
# passed through as-is; empty tone falls back to "fluent".
[tone_map]
formal = "formal business"
fluent = "natural and fluency"
casual = "casual and conversational"
literal = "literal and word-for-word"

# Per-provider request-body fragments merged into each chat-completions call.
[providers.gemini.correct]
model = "gemini-3.1-flash-lite"
reasoning_effort = "low"
temperature = 0

[providers.gemini.translate]
model = "gemini-3.1-flash-lite"
reasoning_effort = "minimal"
temperature = 0

[providers.gemini.extract]
model = "gemini-3.1-flash-lite"
response_format = { type = "json_object" }
temperature = 0

# One-off, user-triggered lookup rather than a per-segment call, so it can
# afford a stronger model than the hot path. `model` is pulled out of the table;
# everything else is sent as the native API's generationConfig.
[providers.gemini.glossary]
model = "gemini-3.6-flash"
temperature = 0

[providers.openai.correct]
model = "gpt-5.4-nano"
max_completion_tokens = 300
reasoning_effort = "none"

[providers.openai.translate]
model = "gpt-5.4-nano"
max_completion_tokens = 300
reasoning_effort = "none"

[providers.openai.extract]
model = "gpt-5.4-mini"
response_format = { type = "json_object" }

# Fallback for the glossary lookup when there is no GEMINI_API_KEY. Goes to the
# Responses API with the web_search tool, so these fields are Responses-shaped
# (`max_output_tokens`, not `max_completion_tokens`); `model` is pulled out.
[providers.openai.glossary]
model = "gpt-5.2"

[providers.groq.correct]
model = "openai/gpt-oss-120b"
reasoning_effort = "low"

[providers.groq.translate]
model = "openai/gpt-oss-120b"
reasoning_effort = "low"

[providers.groq.extract]
model = "openai/gpt-oss-120b"
response_format = { type = "json_object" }

[providers.cerebras.correct]
model = "gemma-4-31b"
reasoning_effort = "low"

[providers.cerebras.translate]
model = "gemma-4-31b"
reasoning_effort = "low"

[providers.cerebras.extract]
model = "gpt-oss-120b"
response_format = { type = "json_object" }
