# Copy this file to config.toml and fill in your values.
#   cp app/config.example.toml app/config.toml
# config.toml is gitignored; config.py parses it into the app's settings.

redis_url = "redis://redis:6379"

[settings]
YOUTUBE_API_KEY = "your-youtube-api-key"
SECRET_KEY = "your-secret-key"

[email_settings]
# List of email addresses with admin dashboard access
ADMIN_EMAILS = ["admin@example.com"]

# SMTP configuration for sending OTP emails.
# Leave SMTP_HOST empty to disable email sending. Outside production the OTP is
# then logged in plaintext so you can log in locally; with ENVIRONMENT=production
# it is never logged and login will not work until SMTP is configured.
SMTP_HOST = ""
SMTP_PORT = 587
SMTP_USERNAME = ""
SMTP_PASSWORD = ""
SMTP_FROM = "noreply@example.com"
SMTP_USE_TLS = true

[mongodb_settings]
db = "opentranslive-db"
host = "mongodb"
port = 27017

[realtime_settings]
# Speech-to-text engine: "elevenlabs" (ElevenLabs Scribe v2 realtime) or "gemini"
# (Gemini Live Transcribe, gemini-3.5-transcribe-live). Each room can override this
# from the panel's Engine select; this is the default for rooms that don't.
# gemini reuses GEMINI_API_KEY below.
STT_PROVIDER = "elevenlabs"

# ElevenLabs Scribe (speech-to-text)
ELEVENLABS_API_KEY = ""

# AI provider API keys (correction and translation). The panel's AI glossary
# lookup needs GEMINI_API_KEY or OPENAI_API_KEY regardless of AI_PROVIDER — see
# _GLOSSARY_PROVIDERS in app/translators/__init__.py. GEMINI_API_KEY also powers
# STT_PROVIDER = "gemini".
GEMINI_API_KEY = ""
OPENAI_API_KEY = ""
GROQ_API_KEY = ""
CEREBRAS_API_KEY = ""

# AI provider default: "gemini", "openai", "groq", or "cerebras".
# Override per-operation with CORRECT_PROVIDER / TRANSLATE_PROVIDER.
# If both are unset they fall back to AI_PROVIDER.
AI_PROVIDER = "openai"
# CORRECT_PROVIDER   = "gemini"   # provider used for ASR correction
# TRANSLATE_PROVIDER = "groq"     # provider used for translation

# Translation settings
TRANSLATE_LANGUAGES = "zh-Hant-TW,en-US"
COMMON_PROMPT = ""

SKIP_CORRECTION = false
FORCE_OPENCC = false

[scribe_settings]
PARTIAL_INTERVAL_SECS = 1.0
# Reconnection and WebSocket health
RECONNECT_BASE_DELAY_SECS = 2.0
RECONNECT_MAX_DELAY_SECS = 60.0
RECONNECT_JITTER_RATIO = 0.25
STATUS_ALERT_ATTEMPT = 2
HEALTHY_CONNECTION_SECS = 30.0
WEBSOCKET_PING_INTERVAL_SECS = 15.0
WEBSOCKET_PING_TIMEOUT_SECS = 10.0
RECEIVE_POLL_INTERVAL_SECS = 2.0
# Mid-segment silence before reconnecting. Keep above WEBSOCKET_PING_TIMEOUT_SECS
# so WebSocket keepalive gets the first chance to detect a dead connection.
OUTPUT_STALL_TIMEOUT_SECS = 25.0
# ElevenLabs emits empty commits while idle; this must exceed that heartbeat interval.
ELEVENLABS_IDLE_OUTPUT_STALL_TIMEOUT_SECS = 60.0
IDLE_TIMEOUT_SECS = 60.0
IDLE_CHECK_INTERVAL_SECS = 30.0
# Proactive provider-session rotation while audio is still flowing.
MAX_SESSION_SECS = 300.0
GEMINI_SETUP_TIMEOUT_SECS = 15.0

# Transcript segmentation and filtering
SEGMENT_START_OFFSET_SECS = 0.3
# Protects correction/translation prompt size and cost.
MAX_PARTIAL_TOKENS = 150
# Approximate words are intentionally script-neutral; token and elapsed-time floors are not.
MIN_COMMIT_WORDS = 6
COMMIT_TIMEOUT_SECS = 10.0
MIN_ALPHABETIC_TRANSCRIPT_CHARS = 3
HALLUCINATION_MIN_TRANSCRIPT_CHARS = 8
HALLUCINATION_MIN_REPETITIONS = 4
HALLUCINATION_MAX_UNIT_CHARS = 8

# Local buffering and usage logging
AUDIO_LOG_INTERVAL_SECS = 30
AUDIO_QUEUE_MAX_CHUNKS = 1000

# ElevenLabs realtime VAD
ELEVENLABS_VAD_SILENCE_THRESHOLD_SECS = 1.0
ELEVENLABS_VAD_THRESHOLD = 0.3
ELEVENLABS_MIN_SPEECH_DURATION_MS = 100
ELEVENLABS_MIN_SILENCE_DURATION_MS = 100

